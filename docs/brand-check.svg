<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- secondary palette as background graphics, the charter's intended use -->
  <circle cx="830" cy="-30" r="190" fill="#fddade" opacity="0.55"/>
  <circle cx="40" cy="620" r="170" fill="#d7ebe7" opacity="0.5"/>
  <circle cx="660" cy="560" r="120" fill="#efeadc" opacity="0.45"/>

  <!-- lock-up as rendered in the application -->
  <g transform="translate(48,44)">
    <g transform="scale(0.92)">
      <circle cx="24" cy="24" r="24" fill="#f8485e"/>
      <circle cx="21" cy="29.5" r="8.25" stroke="#ffffff" stroke-width="4.5" fill="none"/>
      <rect x="27" y="9.5" width="4.5" height="28.25" rx="2.25" fill="#ffffff"/>
    </g>
    <text x="58" y="26" fill="#3c3c3a" font-size="19" font-weight="700" letter-spacing="-0.2">devoteam</text>
    <text x="58" y="41" fill="#77776f" font-size="9" font-weight="500" letter-spacing="1.8">PCA · ETAT DES LIEUX</text>
  </g>

  <text x="48" y="128" fill="#3c3c3a" font-size="21" font-weight="700">Theme clair — palette produit</text>
  <text x="48" y="150" fill="#5c5c58" font-size="12">Fond blanc, texte Dark Grey. Aucun noir pur, aucune couleur hors charte.</text>

  <!-- Primary -->
  <text x="48" y="192" fill="#f8485e" font-size="12" font-weight="700" letter-spacing="1.2">PRIMAIRE</text>
  <g transform="translate(48,206)">
    <circle cx="34" cy="34" r="34" fill="#f8485e"/>
    <text x="0" y="90" fill="#3c3c3a" font-size="12" font-weight="600">Red Poppy</text>
    <text x="0" y="106" fill="#77776f" font-size="11">#f8485e · CTA</text>

    <circle cx="150" cy="34" r="34" fill="#3c3c3a"/>
    <text x="116" y="90" fill="#3c3c3a" font-size="12" font-weight="600">Dark Grey</text>
    <text x="116" y="106" fill="#77776f" font-size="11">#3c3c3a · texte</text>

    <circle cx="266" cy="34" r="34" fill="#ffffff" stroke="#e3e2df"/>
    <text x="232" y="90" fill="#3c3c3a" font-size="12" font-weight="600">White</text>
    <text x="232" y="106" fill="#77776f" font-size="11">#ffffff · fond</text>
  </g>

  <!-- Secondary -->
  <text x="48" y="356" fill="#f8485e" font-size="12" font-weight="700" letter-spacing="1.2">SECONDAIRE — fonds et graphiques</text>
  <g transform="translate(48,370)">
    <circle cx="24" cy="24" r="24" fill="#fca2ae"/>
    <circle cx="90" cy="24" r="24" fill="#fddade"/>
    <circle cx="156" cy="24" r="24" fill="#d7ebe7"/>
    <circle cx="222" cy="24" r="24" fill="#efeadc"/>
    <circle cx="288" cy="24" r="24" fill="#efeeee" stroke="#e3e2df"/>
    <text x="0" y="68" fill="#77776f" font-size="10">Poppy Light · Lighter · Aqua · Beige · Light Grey — jamais du texte</text>
  </g>

  <!-- Accent -->
  <text x="48" y="480" fill="#f8485e" font-size="12" font-weight="700" letter-spacing="1.2">ACCENT — codage sémantique</text>
  <g transform="translate(48,494)">
    <circle cx="20" cy="20" r="20" fill="#5ab891"/>
    <text x="0" y="58" fill="#3c3c3a" font-size="10" font-weight="600">Fresh Mint</text>
    <text x="0" y="71" fill="#77776f" font-size="9">section complétée</text>

    <circle cx="130" cy="20" r="20" fill="#fcc354"/>
    <text x="110" y="58" fill="#3c3c3a" font-size="10" font-weight="600">Intense Fire</text>
    <text x="110" y="71" fill="#77776f" font-size="9">mode dégradé</text>

    <circle cx="240" cy="20" r="20" fill="#4a8cca"/>
    <text x="220" y="58" fill="#3c3c3a" font-size="10" font-weight="600">Blue Lagoon</text>

    <circle cx="350" cy="20" r="20" fill="#ec86a3"/>
    <text x="330" y="58" fill="#3c3c3a" font-size="10" font-weight="600">Candy</text>

    <circle cx="450" cy="20" r="20" fill="#63238c"/>
    <text x="430" y="58" fill="#3c3c3a" font-size="10" font-weight="600">Violet</text>
  </g>

  <!-- UI sample -->
  <g transform="translate(520,186)">
    <rect x="0" y="0" width="332" height="252" rx="16" fill="#ffffff" stroke="#e3e2df"/>
    <circle cx="22" cy="24" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="24" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="24" r="5" fill="#28C840"/>
    <line x1="0" y1="46" x2="332" y2="46" stroke="#e3e2df"/>

    <text x="20" y="72" fill="#77776f" font-size="9" letter-spacing="1.2">2. ORGANISATION, GOUVERNANCE</text>
    <text x="20" y="90" fill="#3c3c3a" font-size="13" font-weight="600">Organigramme &amp; Répartition</text>

    <rect x="20" y="106" width="245" height="40" rx="12" fill="#efeeee"/>
    <text x="32" y="123" fill="#3c3c3a" font-size="10">Decrivez l'organisation : effectif total,</text>
    <text x="32" y="137" fill="#3c3c3a" font-size="10">repartition par equipe et roles.</text>

    <rect x="150" y="158" width="162" height="34" rx="10" fill="#f8485e"/>
    <text x="231" y="179" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Envoyer</text>

    <rect x="20" y="158" width="112" height="34" rx="10" fill="#ffffff" stroke="#e3e2df"/>
    <text x="76" y="179" fill="#5c5c58" font-size="11" text-anchor="middle">Un exemple ?</text>

    <rect x="20" y="208" width="96" height="20" rx="6" fill="#5ab891" fill-opacity="0.12" stroke="#5ab891" stroke-opacity="0.3"/>
    <text x="68" y="222" fill="#3f8a68" font-size="9" text-anchor="middle">Chiffré</text>

    <rect x="126" y="208" width="130" height="20" rx="6" fill="#ffffff" stroke="#e3e2df"/>
    <text x="191" y="222" fill="#5c5c58" font-size="9" text-anchor="middle">Local · qwen2.5:3b</text>
  </g>

  <text x="48" y="576" fill="#77776f" font-size="11">Contrastes mesurés sur blanc : texte 11,06:1 · secondaire 6,72:1 · atténué 4,51:1 (WCAG AA).</text>
</svg>
