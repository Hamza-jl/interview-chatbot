server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The SPA and the API must stay same-origin: the refresh cookie is
    # SameSite=Strict and would not travel cross-site.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 512k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make long-lived caching safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never let a document or an API answer sit in a shared cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    add_header X-Frame-Options            "DENY"       always;
    add_header X-Content-Type-Options     "nosniff"    always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
}
