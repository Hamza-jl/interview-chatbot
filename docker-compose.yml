# Déploiement complet sur une machine unique (un portable qui fait serveur).
#
#   docker compose up -d --build
#
# Quatre services : la base, l'inférence locale, l'API, et nginx qui sert le
# front et relaie /api. Seul nginx publie un port ; le reste ne communique que
# sur le réseau interne.
#
# Les secrets viennent de deploy/.env - jamais de l'image. Voir deploy/DEPLOY.md.
name: etat-des-lieux

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pca
      POSTGRES_USER: pca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pca -d pca"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Le moteur d'analyse tourne ici : rien de ce que saisit un correspondant ne
  # sort de la machine. C'est la raison d'être du déploiement local.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]

  # Télécharge le modèle au premier démarrage, puis s'arrête. Sans lui, la
  # première question d'entretien attendrait 2 Go de téléchargement.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && echo 'modèle prêt'"
    restart: "no"
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://pca:${POSTGRES_PASSWORD}@db:5432/pca

      MASTER_KEK: ${MASTER_KEK:?MASTER_KEK est obligatoire}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      DOWNLOAD_SIGNING_KEY: ${DOWNLOAD_SIGNING_KEY:?DOWNLOAD_SIGNING_KEY est obligatoire}
      # Changer ce séparateur rend illisibles les réponses déjà chiffrées.
      CRYPTO_NAMESPACE: ${CRYPTO_NAMESPACE:-interview-collect}

      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}

      CORS_ORIGINS: ${CORS_ORIGINS:?indiquez l'origine réelle du portail}
      # En HTTP simple sur un réseau local, un cookie Secure n'est jamais
      # renvoyé par le navigateur et la session ne tient pas. Voir DEPLOY.md.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      CLIENT_NAME: ${CLIENT_NAME:-votre organisation}
      PROGRAMME_LABEL: ${PROGRAMME_LABEL:-}
      CONSULTING_ORG: ${CONSULTING_ORG:-l'equipe PCA}
      DOC_REFERENCE_PREFIX: ${DOC_REFERENCE_PREFIX:-EDL}
      PARTICIPANT_EMAIL_DOMAIN: ${PARTICIPANT_EMAIL_DOMAIN:-entites.example.com}
      CONTACT_NAME: ${CONTACT_NAME:-Équipe PCA}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-pca@example.com}
      CONTACT_PHONE: ${CONTACT_PHONE:-}

      TRANSCRIPT_ENABLED: ${TRANSCRIPT_ENABLED:-false}
      TRANSCRIPT_DIR: /srv/var/transcripts
    volumes:
      # Exports chiffrés et base SQLite éventuelle.
      - appdata:/srv/var
      # Les journaux de conversation sont en clair : montés à part, pour être
      # lisibles depuis l'hôte sans ouvrir le reste du volume.
      - ./deploy/transcripts:/srv/var/transcripts
    networks: [internal]
    # Aucun port publié : nginx est la seule porte d'entrée.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks: [internal]

volumes:
  pgdata:
  appdata:
  ollama:

networks:
  internal:
    driver: bridge
